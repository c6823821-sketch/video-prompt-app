<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12121c">
<title>视频反推提示词</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="title-row">
      <h1>视频反推提示词</h1>
      <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
    </div>
    <p class="sub">选视频 → 出复刻提示词，不生成视频</p>
  </header>

  <main>
    <!-- 未配置 Key 提示 -->
    <div id="no-key" class="card warn hidden">
      <div class="warn-icon">⚠</div>
      <div>
        <strong>还没填 API Key</strong>
        <p>点右上角 ⚙ 填入阿里云百炼的 API Key，只需填一次。</p>
        <button class="btn small" onclick="openSettings()">去填写</button>
      </div>
    </div>

    <!-- 上传区 -->
    <div id="upload-area" class="card upload">
      <div class="upload-icon">🎬</div>
      <div class="upload-text">点这里选择视频</div>
      <div class="upload-hint">支持 mp4 / mov / webm，建议 30 秒内</div>
      <input type="file" id="file-input" accept="video/*" hidden>
    </div>

    <!-- 进度 -->
    <div id="progress-card" class="card hidden">
      <div class="progress-head">
        <span id="progress-label">正在处理…</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track"><div id="progress-bar"></div></div>
      <div id="progress-detail" class="progress-detail"></div>
    </div>

    <!-- 结果 -->
    <div id="result" class="hidden">
      <div class="result-head">
        <h2>反推结果</h2>
        <div class="result-actions">
          <button id="btn-copy" class="btn small">复制全部</button>
          <button id="btn-save" class="btn small ghost">保存</button>
        </div>
      </div>
      <div id="video-info" class="video-info"></div>
      <div id="prompt-content"></div>
    </div>

    <!-- 历史 -->
    <div id="history-section" class="hidden">
      <div class="section-head"><h2>历史记录</h2><button id="btn-clear-history" class="link-btn">清空</button></div>
      <div id="history-list"></div>
    </div>
  </main>

  <!-- 设置弹层 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-mask" onclick="closeSettings()"></div>
    <div class="modal-body">
      <div class="modal-head"><h2>设置</h2><button class="icon-btn" onclick="closeSettings()">✕</button></div>
      <label>百炼 API Key</label>
      <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">
      <p class="field-hint">从阿里云百炼控制台获取，只存在你手机本地，不会上传。</p>
      <label>视觉模型</label>
      <select id="model-name">
        <option value="qwen3-vl-plus">qwen3-vl-plus（推荐）</option>
        <option value="qwen-vl-max">qwen-vl-max</option>
        <option value="qwen3.8-omni-flash">qwen3.8-omni-flash</option>
      </select>
      <label>抽帧数量</label>
      <select id="frame-count">
        <option value="4">4 帧（快，省流量）</option>
        <option value="6" selected>6 帧（推荐）</option>
        <option value="8">8 帧（细，慢一点）</option>
      </select>
      <p class="field-hint">帧数越多，提示词越贴原片，但调用费用略高。</p>
      <label>接口地址</label>
      <input type="text" id="base-url" value="https://dashscope.aliyuncs.com/compatible-mode/v1">
      <button class="btn block" onclick="saveSettings()">保存</button>
      <div id="settings-msg" class="settings-msg"></div>
      <div class="about">
        <p>版本 <span id="app-version">1.0.0</span> · <button class="link-btn" onclick="checkUpdate()">检查更新</button></p>
        <p>Key 由你自己的账号承担费用，本 APP 不收集任何数据。</p>
      </div>
    </div>
  </div>

  <!-- 更新提示 -->
  <div id="update-modal" class="modal hidden">
    <div class="modal-mask" onclick="hideUpdate()"></div>
    <div class="modal-body">
      <div class="modal-head"><h2>发现新版本</h2><button class="icon-btn" onclick="hideUpdate()">✕</button></div>
      <p id="update-info"></p>
      <button class="btn block" onclick="downloadUpdate()">下载安装</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
